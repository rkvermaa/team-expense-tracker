# Branching policy (ADR-0121). Only the copy on the repo's DEFAULT branch (`main`) counts.
version: 1

# github-flow: work branches fork from `main` and their PRs land on `main`.
template: github-flow

# One branch per work item, e.g. EXPENSE-TRACKER-2-STORY-012-add-login.
work_branch_pattern: "{item_id}-{slug}"
