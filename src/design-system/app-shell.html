<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Expense Tracker — App shell</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="prototype-utils.css">
<style>
  [data-arc-shell] { min-height: 100vh; display: flex; flex-direction: column; }
  .shell-header {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-2);
    padding: var(--space-2) var(--space-3); border-bottom: var(--border-width) solid var(--color-border);
    background: var(--color-bg);
  }
  .shell-brand { font-weight: var(--font-weight-bold); font-size: var(--font-size-lg); color: var(--color-fg); text-decoration: none; }
  .shell-nav { display: flex; flex-direction: column; gap: var(--space-1); width: 100%; margin: 0; padding: 0; list-style: none; }
  .shell-nav[hidden] { display: none !important; }
  .shell-nav[hidden].is-open { display: flex !important; }
  .shell-nav a {
    display: block; padding: var(--space-2) var(--space-3); color: var(--color-fg);
    text-decoration: none; border-radius: var(--radius-md); font-weight: var(--font-weight-medium);
  }
  .shell-nav a:hover { background: var(--color-bg-subtle); }
  .shell-nav a[aria-current="page"] { color: var(--color-primary); background: var(--color-info-bg); }
  .shell-nav-toggle { display: inline-flex; }
  .shell-header > nav { flex-basis: 100%; }
  .shell-layout { flex: 1; width: 100%; max-width: var(--shell-max-width); margin: 0 auto; padding: var(--space-3); }
  .shell-footer {
    padding: var(--space-3); border-top: var(--border-width) solid var(--color-border);
    color: var(--color-fg-muted); font-size: var(--font-size-sm);
  }
  @media (min-width: 720px) {
    .shell-nav, .shell-nav[hidden] { display: flex !important; flex-direction: row; width: auto; }
    .shell-nav-toggle { display: none; }
    .shell-header > nav { flex-basis: auto; }
    .shell-header { padding: var(--space-2) var(--space-4); }
    .shell-layout { padding: var(--space-4); }
  }
</style>
</head>
<body>
<div data-arc-shell>
  <header class="shell-header" data-arc-shell-part="header">
    <a class="shell-brand" href="/dashboard">Team Expense Tracker</a>
    <button class="btn btn-secondary btn-sm shell-nav-toggle" type="button" data-toggle="main-nav" aria-controls="main-nav" aria-label="Menu">Menu</button>
    <nav data-arc-shell-part="nav" aria-label="Main">
      <ul class="shell-nav" id="main-nav" hidden>
        <li><a href="/dashboard" data-nav-key="dashboard">Dashboard</a></li>
        <li><a href="/manager" data-nav-key="manager">Manager area</a></li>
      </ul>
    </nav>
  </header>
  <main class="shell-layout">
    <div data-arc-content></div>
  </main>
  <footer class="shell-footer" data-arc-shell-part="footer">Team Expense Tracker</footer>
</div>
</body>
</html>
